        run: |
          set -o pipefail
          flutter build macos --release --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee macos_build.log || { echo "=== MACOS BUILD FAILED ===" && tail -n 500 macos_build.log; exit 1; }
      - name: 打包 macOS 安装文件
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)
          echo "找到 App: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" NexHub-macos.zip
      - name: 打包 macOS .dmg 安装镜像
        # 用 hdiutil 把 .app 打成 dmg，与 zip 并存，方便双击挂载安装。
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)
          echo "找到 App: $APP"
          hdiutil create -volname NexHub -srcfolder "$APP" -ov -format UDZO NexHub-macos.dmg
          ls -la NexHub-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: NexHub-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: NexHub-macos.dmg
          if-no-files-found: error

  release:
    name: 发布到 GitHub Releases
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: NexHub ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/android-apk/*.apk
            artifacts/windows-build/NexHub-windows-x64.zip
            artifacts/windows-installer/NexHub-setup-*.exe
            artifacts/linux-build/NexHub-linux-x64.tar.gz
            artifacts/linux-deb/NexHub-linux-x64.deb
            artifacts/linux-appimage/NexHub-linux-x64.AppImage
            artifacts/macos-build/NexHub-macos.zip
            artifacts/macos-dmg/NexHub-macos.dmg
