#       该 exit code 的真实根因之一。
#     - **修复**：AppImage 步骤内 `sudo apt-get install -y libfuse2`（装不上也不致命），
#       两个 linuxdeploy 调用均加 `--appimage-extract-and-run` 规避 FUSE；整体 `set +e` 且
#       末尾 `exit 0`，确保 AppImage 打不出也不影响发布（tar.gz/deb 仍在）；新增
#       `linux-appimage-log` artifact（if:always()）上传 `appimage_build.log` 便于失败复现。
#   v27（当前，v2.0.0-beta.4 修复）：
#     - **Android 编译在 cargokit 原生构建任务必挂**：`:irondash_engine_context:
#       cargokitCargoBuild…` 报 `Could not find method exec()`。根因是 Gradle 9 移除了
#       `Project.exec(Closure)` 重载，而 irondash 0.5.5 自带的 cargokit（gradle/plugin.gradle
#       第 60/65 行）仍用 `project.exec { … }` 闭包；本地能过只是因为 Rust 产物已缓存、该
#       task 被跳过（UP-TO-DATE），CI 为 clean 构建必跑到这行。
#     - **第一版补丁没生效的坑**：glob 写成精确的 `cargokit`（路径段必须正好叫 cargokit），
#       但 pub 缓存里的目录实为 `cargokit-<版本号>`，所以一个都没匹配到、静默「跳过」，
#       Gradle 9 下照样崩。修正为 `cargokit*`，并加上「找不到 / 打不上就 sys.exit(1) 显式失败」
#       的防静默逻辑（避免上游改结构后在 Gradle 深处报一个看不懂的错）。
#     - **第二版补丁仍漏改关键块的坑**：第 65 行那处真正执行 cargo 构建的 exec 块里含 GString
#       `"${buildDir}/build_tool"`，其 `{ }` 花括号让只认 `[^{}]*` 的正则提前断裂、整个块匹配失败，
#       结果只改了第 60 行的 chmod 块、构建块仍是 Gradle 9 不支持的闭包写法 → 照挂。修正为先用
#       `\x00…\x00` 占位符屏蔽 `${...}` 再匹配、匹配完还原，并给 plugin.gradle 补 `Action` /
#       `ExecSpec` 的 import 兜底。
#     - **移除条件**：irondash 发布 Gradle 9 兼容版（cargokit 改写 exec 调用）后，本步可删除。
# =============================================================================

name: Build & Release NexHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 获取依赖
        run: flutter pub get 2>&1
      - name: 修补插件 proguard 配置以兼容 AGP 9
        # AGP 9.0 起彻底移除了 getDefaultProguardFile('proguard-android.txt')，
        # 仍调用它的旧插件（如 flutter_inappwebview_android 1.1.3，官方 issue #2852 未发版修复）
        # 会在评估期直接 FAILURE。这里在构建前把 pub 缓存里所有插件 android/build.gradle 中的
        # proguard-android.txt 替换为官方推荐的 proguard-android-optimize.txt。
        # 仅改 pub 缓存，不触碰仓库源码；应用 release 已关闭 minify，库模块行为不受影响。
        shell: bash
        run: |
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          count=0
          while IFS= read -r f; do
            if grep -q "proguard-android\.txt" "$f"; then
              sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
              echo "patched: $f"
              count=$((count+1))
            fi
          done < <(find "$PUB_CACHE_DIR" -path '*/android/build.gradle' 2>/dev/null)
          if [ "$count" -eq 0 ]; then
            echo "未发现需要修补的 proguard-android.txt（插件可能已兼容 AGP 9），跳过"
          else
            echo "共修补 $count 个插件 build.gradle"
          fi
      - name: 修补 cargokit exec 调用以兼容 Gradle 9
        # Gradle 9 移除了 Project.exec(Closure) 重载，irondash 0.5.5 自带的 cargokit
        # (gradle/plugin.gradle) 仍用 project.exec { ... } 闭包，会在执行期报
        # "Could not find method exec()"。这里改写为 Gradle 9 可用的 Groovy SAM 闭包
        # project.exec { spec -> spec.xxx } 形式（spec 类型由 Project.exec(Action) 推断）。
        # 关键：plugin.gradle 作为脚本插件，其编译 classpath 不含 Gradle API 类，
        # 故不能用 new Action<ExecSpec>() 这种显式类型引用（会报 unable to resolve class）。
        # 仅改 pub 缓存，不触碰仓库源码；irondash 发布修复后可移除本步。
        shell: bash
        run: |
          set -euo pipefail
          export PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          python3 - <<'PY'
          import glob, os, re, sys
          patched = 0
          found = 0
          pub_cache_dir = os.environ.get('PUB_CACHE_DIR') or os.environ.get('PUB_CACHE') or os.path.expanduser('~/.pub-cache')
          # 注意：pub 缓存里目录名为 cargokit-<版本号>（如 cargokit-1.5.1），
          # 不能用精确的 'cargokit'，否则 glob 匹配不到任何文件、静默跳过。
          # 第二处 exec 块里含 GString "${buildDir}"，其 { } 花括号会让只认 [^{}]* 的正则
          # 在匹配时提前断裂，导致该关键构建块漏改、Gradle 9 下照挂。故先用占位符屏蔽
          # ${...} 再匹配，匹配后还原。
          pattern = re.compile(r'project\.exec\s*\{(?!spec\b)([^{}]*)\}', re.S)
          method_re = re.compile(r'^(\s+)(commandLine|executable|args|environment|workingDir|standardOutput|errorOutput|ignoreExitValue|standardInput|setStandardOutput|setErrorOutput)(\s)')
          def repl(m):
              body = m.group(1)
              new_lines = []
              for line in body.split('\n'):
                  new_lines.append(method_re.sub(r'\1spec.\2\3', line))
              return 'project.exec { spec ->' + '\n'.join(new_lines) + '}'
          gs_re = re.compile(r'\$\{[^}]*\}')
          for path in glob.glob(os.path.join(pub_cache_dir, '**', 'cargokit*', 'gradle', 'plugin.gradle'), recursive=True):
              found += 1
              with open(path, 'r', encoding='utf-8') as f:
                  src = f.read()
              if 'spec ->' in src:
                  continue  # 已修补，跳过
              # 屏蔽 GString 的 ${...} 花括号，避免正则 [^{}]* 提前断裂、漏改关键构建块
              protected_src = gs_re.sub(lambda mm: '\x00' + mm.group(0)[2:-1] + '\x00', src)
              new_protected, n = pattern.subn(repl, protected_src)
              if n == 0:
                  # 文件存在但闭包结构已变化，无法自动修补：显式失败，避免后续在
                  # Gradle 深处报一个莫名其妙的 "Could not find method exec()"。
                  print(f"!! cargokit plugin.gradle 结构已变化，无法自动修补: {path}")
                  sys.exit(1)
              # 还原 ${...}
              new_src = re.sub('\x00([^\x00]*)\x00', lambda mm: '${' + mm.group(1) + '}', new_protected)
              if 'spec.' not in new_src:
                  print(f"!! 修补后未生成任何 spec. 调用，疑似正则失效: {path}")
                  sys.exit(1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(new_src)
              patched += n
              print(f"patched ({n} exec blocks): {path}")
          if found == 0:
              print("!! 未在 pub 缓存中找到任何 cargokit plugin.gradle，无法修补 Gradle 9 兼容问题")
              sys.exit(1)
          if patched == 0:
              print("cargokit plugin.gradle 已包含 Gradle 9 兼容写法（无需修补）")
          else:
              print(f"共修补 {patched} 处 cargokit exec 调用")
          PY
      - name: 生成多语言文件 (gen-l10n)
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 源图：assets/icon/icon.png（含 adaptive_icon_background 蓝青主色 #0EA5E9）。
        # flutter_launcher_icons 不会在 `flutter build` 时自动重跑，故这里显式生成，
        # 保证每次构建都基于源图产出最新图标（含自适应图标，Android 12+ 莫奈取色生效）。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: 还原签名 keystore（从 Secrets）
        # keystore 与签名密码已不入库：ANDROID_KEYSTORE_BASE64 为 jks 文件的 base64，
        # 其余三项为签名凭据。Secrets 缺失（如 fork PR）时跳过，
        # build.gradle.kts 会自动回落 debug 签名，保证仍可编译。
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret 未配置，跳过（将回落 debug 签名）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/upload-keystore.jks"
          } > android/key.properties
          echo "keystore 与 key.properties 已还原"
      - name: 编译 APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee apk_build.log || { echo "=== ANDROID BUILD FAILED ===" && tail -n 500 apk_build.log; exit 1; }
      - name: 编译通用 APK（fat，单文件全架构）
        # 与上方 --split-per-abi 分包并存：本步产出 app-release.apk（一个包适配所有 ABI），
        # 方便不想按架构挑包的用户直接安装。产物同样落在 build/app/outputs/flutter-apk/，
        # 由下方通配 *.apk 一并上传。
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee apk_fat_build.log || { echo "=== ANDROID FAT APK BUILD FAILED ===" && tail -n 500 apk_fat_build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop
      - name: 获取依赖
        run: flutter pub get 2>&1
      - name: 生成多语言文件 (gen-l10n)
        shell: bash
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 源图：assets/icon/icon.png（含 adaptive_icon_background 蓝青主色 #0EA5E9）。
        # 确保 Windows 也用上自定义图标（覆盖仓库里那份旧的 Flutter 默认 logo），
        # 同时重新生成 Android 自适应图标资源。每次构建都基于源图重新生成。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: 编译 Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee win_build.log || { echo "=== WINDOWS BUILD FAILED ===" && tail -n 200 win_build.log; exit 1; }
      - name: 打包 Windows 安装文件
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "NexHub-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: NexHub-windows-x64.zip
          if-no-files-found: error
      - name: 计算版本号（去掉 v 前缀，供安装包使用）
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: 打包 Windows 安装包 (Inno Setup -> exe)
        # 脚本：windows/installer/NexHub.iss；MyAppVersion 由 /D 传入（已去 v）。
        # 图标用上一步 flutter_launcher_icons 重新生成的自定义 app_icon.ico。
        # 用 Chocolatey 装 Inno Setup 后直接调 ISCC.exe（不依赖第三方 action 仓库，
        # 避免 minissoftware/Inno-Setup-Action 仓库不存在导致 Windows 构建失败）。
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          choco install innosetup -y
          New-Item -ItemType Directory -Force -Path windows/installer/Output | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found at $iscc - Inno Setup 安装失败或路径不同"
            exit 1
          }
          # 提前校验中文语言文件存在，避免 ISCC 编译到一半才因缺文件 abort（报错难定位）
          $isl = "windows\installer\Languages\ChineseSimplified.isl"
          if (-not (Test-Path $isl)) {
            Write-Error "缺少安装包中文语言文件: $isl"
            Write-Host "windows/installer 目录内容："
            Get-ChildItem -Path windows/installer -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          & $iscc "windows/installer/NexHub.iss" "/DMyAppVersion=$env:VERSION"
          # ISCC 可能把 exe 写到仓库根 Output/ 或 windows/installer/Output/（取决于 OutputDir 解析），
          # 兜底：两个位置都找，找到就复制到 windows/installer/Output（上传步骤期望的位置）
          $expectedDirs = @('windows\installer\Output', 'Output')
          $out = $null
          foreach ($d in $expectedDirs) {
            if (Test-Path $d) {
              $files = Get-ChildItem -Path $d -Filter *.exe -Recurse -ErrorAction SilentlyContinue
              if ($files -and $files.Count -gt 0) { $out = $files[0]; break }
            }
          }
          if (-not $out) {
            Write-Error "ISCC 未产出安装包 exe（windows/installer/Output 与 Output 下均未找到 *.exe）"
            Write-Host "windows/installer 目录内容："
            Get-ChildItem -Path windows/installer -Recurse | ForEach-Object { Write-Host $_.FullName }
            Write-Host "根目录 Output 目录内容："
            if (Test-Path Output) { Get-ChildItem -Path Output -Recurse | ForEach-Object { Write-Host $_.FullName } }
            exit 1
          }
          # 守卫复制：源与目标相同时（OutputDir 已直接写到 windows/installer/Output）跳过，
          # 避免 PowerShell 报 "Cannot overwrite the item ... with itself" 导致 step 失败。
          # 关键：目标路径也要转成绝对路径再比，否则相对路径 vs 绝对路径比较永远不相等。
          $destDir = "windows/installer/Output"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $destPathFull = [System.IO.Path]::GetFullPath((Join-Path $destDir $out.Name))
          if (-not (Test-Path $out.FullName)) {
            Write-Error "Expected installer not found: $($out.FullName)"
            exit 1
          }
          Write-Host "Source: $($out.FullName)"
          Write-Host "Dest  : $destPathFull"
          if ($out.FullName -ieq $destPathFull) {
            Write-Host "Installer already in destination: $destPathFull — skipping copy"
          } else {
            Write-Host "Copying installer $($out.FullName) -> $destDir"
            try {
              Copy-Item -Path $out.FullName -Destination $destDir -Force -ErrorAction Stop
            } catch {
              Write-Warning "Failed to copy installer: $($_.Exception.Message) — continuing if benign overwrite"
              throw
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/installer/Output/*.exe
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 编译依赖（更完整）
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libportal-dev libnotify-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxcomposite-dev libxdamage-dev libxtst-dev \
            libatk1.0-dev libcups2-dev \
            libasound2-dev libxss1 libpulse-dev libspeechd-dev \
            libglu1-mesa-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwebkit2gtk-4.1-dev libjsoncpp-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 启用 Linux 桌面支持
        run: flutter config --enable-linux-desktop
      - name: 确保 Linux 桌面工程存在（缺失则生成）
        run: |
          set -e
          if [ -f linux/CMakeLists.txt ]; then
            echo "Linux 桌面工程已存在，跳过生成"
          else
            echo "缺失 linux/CMakeLists.txt，重新生成 Linux 桌面工程"
            ICON=linux/flutter/icons.png
            [ -f "$ICON" ] && cp "$ICON" /tmp/nexhub_icon.png || true
            rm -rf linux
            flutter create --platforms=linux .
            [ -f /tmp/nexhub_icon.png ] && cp /tmp/nexhub_icon.png linux/flutter/icons.png || true
          fi
          echo "== linux/ 结构 =="
          ls -la linux
      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 覆盖 flutter create 生成的默认 Logo（仓库里 linux/ 被简化、没有 runner/，
        # flutter create 会放 Flutter 默认 Logo 当应用图标；这里用 NexHub 自定义图标覆盖）。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: Flutter 环境与诊断 (debug)
        run: |
          echo "FLUTTER_ROOT: ${FLUTTER_ROOT:-<unset>}"
          flutter --version
          flutter doctor -v || true
          uname -a
          lsb_release -a || true
      - name: Precache Flutter Linux 产物
        run: flutter precache --linux
      - name: 清理旧缓存（置于 pub get 之前，安全）
        run: flutter clean || true
      - name: 获取依赖 (verbose + 重试)
        run: |
          set -eux
          if flutter pub get; then
            echo "pub get succeeded"
          else
            echo "pub get 失败，改用 verbose 输出重试..."
            flutter pub get --verbose > pubget.log 2>&1 || true
            tail -n 500 pubget.log
            exit 1
          fi
      - name: 生成多语言文件 (gen-l10n)
        run: |
          flutter gen-l10n 2>&1
          echo "== generated l10n files =="
          ls -la lib/generated 2>&1 || true
          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 编译 Linux (verbose + 日志)
        run: |
          set -o pipefail
          flutter build linux --release --verbose --dart-define=DANMAKU_APP_ID=${{ secrets.DANMAKU_APP_ID }} --dart-define=DANMAKU_APP_SECRET=${{ secrets.DANMAKU_APP_SECRET }} --dart-define=BANGUMI_CLIENT_ID=${{ secrets.BANGUMI_CLIENT_ID }} --dart-define=BANGUMI_CLIENT_SECRET=${{ secrets.BANGUMI_CLIENT_SECRET }} 2>&1 | tee flutter_build.log || { tail -n 500 flutter_build.log; exit 1; }
      - name: 上传构建日志 (始终，便于失败排查)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-flutter-build-log
          path: flutter_build.log
          if-no-files-found: ignore
      - name: 打包 Linux 安装文件
        run: tar -czf NexHub-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: NexHub-linux-x64.tar.gz
          if-no-files-found: error
      - name: 计算版本号（去掉 v 前缀，供 deb/AppImage 使用）
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: 打包 Linux .deb 安装包
        # 用 dpkg-deb 把 release bundle 打成 deb：opt/nexhub 放整套产物，
        # /usr/bin/nexhub 软链到可执行，附带 desktop 入口与图标。
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          BUNDLE=build/linux/x64/release/bundle
          STAGE=nexhub-deb
          rm -rf "$STAGE"
          mkdir -p "$STAGE/DEBIAN" "$STAGE/opt/nexhub" "$STAGE/usr/bin" \
                   "$STAGE/usr/share/applications" \
                   "$STAGE/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE/." "$STAGE/opt/nexhub/"
          ln -s /opt/nexhub/nexhub "$STAGE/usr/bin/nexhub"
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: nexhub
          Version: ${VERSION}
          Section: multimedia
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libmpv1 | libmpv2, libsecret-1-0, libjsoncpp25, libglu1-mesa, libpulse0, libasound2, libnotify4
          Maintainer: NexHub <noreply@nexhub.app>
          Description: NexHub - 媒体聚合客户端（动漫/漫画/小说/影视）
           一款插件驱动的跨模块媒体聚合客户端。
          EOF
          cat > "$STAGE/usr/share/applications/nexhub.desktop" <<'EOF'
          [Desktop Entry]
          Name=NexHub
          Comment=媒体聚合客户端（动漫/漫画/小说/影视）
          Exec=/opt/nexhub/nexhub
          Icon=nexhub
          Type=Application
          Categories=AudioVideo;Video;Utility;
          Terminal=false
          EOF
          if [ -f assets/icon/icon.png ]; then
            cp assets/icon/icon.png "$STAGE/usr/share/icons/hicolor/256x256/apps/nexhub.png"
          fi
          dpkg-deb --build "$STAGE" "NexHub-linux-x64.deb"
          ls -la NexHub-linux-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: NexHub-linux-x64.deb
          if-no-files-found: error
      - name: 打包 Linux .AppImage（best-effort）
        # 用 linuxdeploy + flutter 插件把 bundle 打成 AppImage。该步骤依赖外部下载，
        # 失败仅警告、不阻断发布（仍保留 tar.gz 与 deb）。
        # 历史坑（v2.0.0-beta.2 实测 exit code 8）：
        #   GitHub ubuntu 运行实例默认未装 libfuse2，linuxdeploy / 插件 AppImage 自挂载失败；
        #   且原脚本 --plugin flutter 主命令失败后，兜底命令未加 || 容错，set -e 直接中断
        #   整个 Linux job、连带阻断 release。现改为：装 libfuse2 + 全程 --appimage-extract-and-run
        #   规避 FUSE，整体 set +e 且末尾 exit 0，确保 AppImage 打不出也不影响发布。
        shell: bash
        run: |
          set -e
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=AppDir
          rm -rf "$APPDIR" NexHub-linux-x64.AppImage appimage_build.log
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE/." "$APPDIR/usr/bin/"
          cat > "$APPDIR/usr/share/applications/nexhub.desktop" <<'EOF'
          [Desktop Entry]
          Name=NexHub
          Comment=媒体聚合客户端（动漫/漫画/小说/影视）
          Exec=nexhub
          Icon=nexhub
          Type=Application
          Categories=AudioVideo;Video;Utility;
          Terminal=false
          EOF
          if [ -f assets/icon/icon.png ]; then
            cp assets/icon/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/nexhub.png"
          fi
          # AppImage 运行需要 libfuse2（ubuntu 22.04+ 默认未装），装不上也不致命
          sudo apt-get install -y libfuse2 2>&1 | tail -n 5 || true
          # flutter bundle 已是自包含 ELF + 资源，无需 linuxdeploy-plugin-flutter。
          # 该 continuous 插件返回空 --plugin-api-version，会报 "Could not find plugin: flutter"，故弃用。
          # 直接用 linuxdeploy --output appimage 打包；linuxdeploy 产出文件名形如
          # NexHub-x86_64.AppImage，统一重命名为工作流期望的 NexHub-linux-x64.AppImage。
          export PATH="$PWD:$PATH"
          set +e
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appimage-extract-and-run --appdir "$APPDIR" --output appimage > appimage_build.log 2>&1
          RC=$?
          set -e
          # linuxdeploy 产出文件名不确定（通常 NexHub-x86_64.AppImage），统一重命名为预期名
          if [ ! -f NexHub-linux-x64.AppImage ]; then
            SRC=$(ls NexHub-*.AppImage 2>/dev/null | head -n1)
            if [ -n "$SRC" ]; then
              mv "$SRC" NexHub-linux-x64.AppImage
            fi
          fi
          if [ -f NexHub-linux-x64.AppImage ]; then
            echo "AppImage 已产出："
            ls -la NexHub-linux-x64.AppImage
          else
            echo "AppImage 未产出（best-effort 跳过，不阻断发布），rc=$RC"
            echo "== appimage_build.log 末尾 =="
            tail -n 60 appimage_build.log 2>/dev/null || true
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-log
          path: appimage_build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: NexHub-linux-x64.AppImage
          if-no-files-found: warn

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true
      - name: 启用 macOS 桌面支持
