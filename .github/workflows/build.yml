          grep -n "class AppLocalizations" lib/generated/app_localizations.dart 2>&1 || true
      - name: 重新生成启动图标 (flutter_launcher_icons)
        # 用 assets/icon/icon.png 重新生成 macOS AppIcon.appiconset，
        # 避免仓库里 commit 的旧图标（与源图不一致）。
        run: flutter pub run flutter_launcher_icons 2>&1 || dart run flutter_launcher_icons 2>&1
      - name: 编译 macOS
