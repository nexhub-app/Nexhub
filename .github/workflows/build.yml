#   v26（当前，v2.0.0-beta.2 补）：
#     - **Linux .AppImage 步骤失败 exit code 8**：原脚本 `set -e` 下，linuxdeploy 的
#       `--plugin flutter` 主命令失败后，兜底命令 `./linuxdeploy.AppImage --appdir ... --output appimage`
#       也未加 `||` 容错，导致 `set -e` 直接中断整个 Linux job、连带阻断 release；且 GitHub
