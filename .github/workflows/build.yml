#     - **需要新增的仓库 Secrets（缺失时不会报错，只是 OAuth 不可用）**：
#       `BANGUMI_CLIENT_ID` / `BANGUMI_CLIENT_SECRET`，在 https://bgm.tv/dev/app/create
