org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin daemon 映射内存过大时，Windows 下增量编译缓存关闭会崩溃
# （registerPagedFileStorage "Storage is already registered"，所有 Kotlin 插件模块复现，
# in-process / 调整 daemon 内存均无效）。关闭 Kotlin 增量编译规避，代价是重编译稍慢。
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# 下载断流时快速失败重试，避免无限假死。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=3
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
